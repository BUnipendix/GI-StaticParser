[package]
name = "static_mhy_dumper"
version = "0.1.0"
edition = "2021"
description = "Static, assembly-scan-based IL2CPP 'MHY' metadata dumper"
license = "GPL-3.0-only"

[lib]
name = "static_mhy_dumper"
path = "src/lib.rs"

[[bin]]
name = "mhydump"
path = "src/main.rs"

[dependencies]

rayon = "=1.12.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
pelite = "0.10"
clap = { version = "4.6", features = ["derive"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder", "instr_info"] }
unicorn-engine = { version = "2.1.5", default-features = false, features = ["arch_x86"] }
